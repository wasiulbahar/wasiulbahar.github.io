<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Desk</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root { --bg: #f4f1e8; --card: #fff; --ink: #141714; --ink2: #55594f; --line: #141714; --green: #0f7a55; --yellow: #ffd23f; --red: #d6402b; --soft: #e9e5d8; }
@media (prefers-color-scheme: dark) { :root { --bg: #111411; --card: #1b1f1b; --ink: #f2efe6; --ink2: #a9ad9f; --line: #f2efe6; --soft: #262b26; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 0 16px; }
header.top h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.03em; flex: 1; }
.status { font-size: .875rem; padding: 6px 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--card); }
.status.ok { background: #d6f0e2; color: #0b4a34; } .status.bad { background: #f9d9d3; color: #6b1a0e; } .status.busy { background: var(--yellow); color: #141714; }
.layout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: start; }
nav.sections { display: grid; gap: 4px; position: sticky; top: 12px; }
nav.sections button { text-align: left; padding: 8px 12px; border: 2px solid transparent; border-radius: 8px; background: none; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
nav.sections button:hover { background: var(--soft); }
nav.sections button[aria-current="true"] { background: var(--card); border-color: var(--line); font-weight: 700; }
nav.sections .n { color: var(--ink2); font-size: .8rem; }
nav.sections .n.alert { background: var(--red); color: #fff; border-radius: 99px; padding: 0 7px; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } nav.sections { position: static; grid-auto-flow: column; overflow-x: auto; grid-auto-columns: max-content; padding-bottom: 6px; } }
h2 { margin: 0 0 4px; font-size: 1.3rem; } .hint { color: var(--ink2); margin: 0 0 14px; font-size: .92rem; }
.btn { padding: 8px 14px; border: 2px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; font-weight: 600; box-shadow: 2px 2px 0 var(--line); }
a.btn { color: inherit; text-decoration: none; display: inline-block; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--line); } .btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.go { background: var(--green); color: #fff; } .btn.warn { color: var(--red); } .btn.small { padding: 4px 9px; font-size: .85rem; box-shadow: none; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.item { background: var(--card); border: 2px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
.item.hidden-item { opacity: .55; border-style: dashed; }
.row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; flex-wrap: wrap; }
.row .t { flex: 1; min-width: 180px; font-weight: 600; overflow-wrap: anywhere; } .row .s { display: block; font-weight: 400; color: var(--ink2); font-size: .85rem; }
.tag { font-size: .72rem; padding: 1px 7px; border-radius: 99px; background: var(--soft); color: var(--ink2); font-weight: 600; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; padding: 12px; border-top: 2px solid var(--line); }
.form label { display: grid; gap: 3px; font-size: .85rem; color: var(--ink2); font-weight: 600; } .form label.wide { grid-column: 1 / -1; }
input, select, textarea { width: 100%; padding: 8px 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); }
textarea { min-height: 84px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; }
.thumb { max-width: 140px; max-height: 100px; border: 2px solid var(--line); border-radius: 6px; display: block; margin-top: 6px; }
.savebar { position: sticky; bottom: 0; background: var(--yellow); color: #141714; border-top: 2px solid #141714; padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; font-weight: 600; }
.savebar[hidden], [hidden] { display: none !important; }
.sign { max-width: 560px; margin: 8vh auto; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 22px; box-shadow: 5px 5px 0 var(--line); }
.sign ol { padding-left: 20px; color: var(--ink2); } .sign a { color: inherit; } .err { color: var(--red); font-weight: 600; min-height: 1.5em; }
.notes { margin: 0 0 16px; padding: 10px 14px 10px 30px; background: var(--card); border: 2px solid var(--line); border-radius: 10px; }
.pending { background: var(--yellow); color: #141714; border: 2px solid #141714; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
.pending ul { margin: 6px 0; padding-left: 20px; } .pending p { margin: 0 0 10px; font-size: .9rem; }
.otd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.otd-grid figure { margin: 0; background: var(--card); border: 2px solid var(--line); border-radius: 8px; overflow: hidden; }
.otd-grid img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; } .otd-grid figcaption { padding: 6px 8px; font-size: .8rem; display: grid; gap: 6px; }
</style>
</head>
<body>
<div id="app" class="wrap"><p>Loading…</p></div>
<div class="savebar" id="savebar" hidden><span id="savemsg">You have unsaved changes.</span><button class="btn go" id="save" type="button">Save and publish</button><button class="btn" id="discard" type="button">Discard</button></div>
<script src="desk.js"></script>
</body>
</html>
